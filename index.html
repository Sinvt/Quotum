<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotum · 每日双语名言</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-start: #0f0c29;
    --bg-mid: #302b63;
    --bg-end: #24243e;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.1);
    --card-shadow: 0 30px 60px rgba(0,0,0,0.4);
    --daily-border: rgba(255,215,0,0.3);
    --daily-glow: 0 0 40px rgba(255,215,0,0.08);
    --badge-color: rgba(255,215,0,0.7);
    --text-cn: #f0e6d3;
    --text-en: #c4b9a8;
    --text-author: rgba(255,255,255,0.45);
    --text-info: rgba(255,255,255,0.22);
    --text-date: rgba(255,255,255,0.25);
    --text-muted: rgba(255,255,255,0.18);
    --btn-bg: rgba(255,255,255,0.06);
    --btn-border: rgba(255,255,255,0.15);
    --btn-color: rgba(255,255,255,0.65);
    --btn-ghost-border: rgba(255,255,255,0.1);
    --btn-ghost-color: rgba(255,255,255,0.4);
    --divider-bg: rgba(255,255,255,0.3);
    --history-card-bg: rgba(255,255,255,0.03);
    --history-card-border: rgba(255,255,255,0.06);
    --form-bg: #1e1e3a;
    --form-border: rgba(255,255,255,0.12);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.1);
    --input-color: #f0e6d3;
    --overlay-bg: rgba(0,0,0,0.65);
    --fav-active: #ff6b8a;
    --tab-active-bg: rgba(255,255,255,0.12);
    --tab-hover-bg: rgba(255,255,255,0.06);
    --eco-accent: rgba(76,175,80,0.6);
    --eco-border: rgba(76,175,80,0.15);
    --api-border: rgba(100,200,255,0.15);
  }

  body.light {
    --bg-start: #f5f0e8;
    --bg-mid: #e8e0d5;
    --bg-end: #ddd6c8;
    --card-bg: rgba(0,0,0,0.03);
    --card-border: rgba(0,0,0,0.08);
    --card-shadow: 0 20px 50px rgba(0,0,0,0.08);
    --daily-border: rgba(180,140,60,0.5);
    --daily-glow: 0 0 40px rgba(180,140,60,0.12);
    --badge-color: rgba(140,100,30,0.8);
    --text-cn: #3a3028;
    --text-en: #6b5d4f;
    --text-author: rgba(0,0,0,0.4);
    --text-info: rgba(0,0,0,0.3);
    --text-date: rgba(0,0,0,0.28);
    --text-muted: rgba(0,0,0,0.2);
    --btn-bg: rgba(0,0,0,0.04);
    --btn-border: rgba(0,0,0,0.12);
    --btn-color: rgba(0,0,0,0.55);
    --btn-ghost-border: rgba(0,0,0,0.1);
    --btn-ghost-color: rgba(0,0,0,0.38);
    --divider-bg: rgba(0,0,0,0.15);
    --history-card-bg: rgba(0,0,0,0.02);
    --history-card-border: rgba(0,0,0,0.05);
    --form-bg: #faf8f4;
    --form-border: rgba(0,0,0,0.12);
    --input-bg: rgba(0,0,0,0.03);
    --input-border: rgba(0,0,0,0.1);
    --input-color: #3a3028;
    --overlay-bg: rgba(0,0,0,0.4);
    --tab-active-bg: rgba(0,0,0,0.08);
    --tab-hover-bg: rgba(0,0,0,0.04);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
    background-attachment: fixed;
    font-family: 'Georgia', 'Noto Serif SC', 'STSong', serif;
    transition: background 0.8s ease;
    padding: 40px 0 60px;
  }

  .top-bar {
    position: fixed;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 50;
  }

  .btn-icon {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--btn-ghost-border);
    background: var(--card-bg); color: var(--btn-ghost-color);
    font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s ease; font-family: inherit;
  }

  .btn-icon:hover { border-color: var(--btn-border); color: var(--btn-color); }

  .tab-bar {
    display: flex; gap: 4px;
    background: var(--card-bg);
    border: 1px solid var(--btn-ghost-border);
    border-radius: 40px; padding: 4px;
    margin-bottom: 10px; margin-top: 16px;
  }

  .tab-btn {
    padding: 10px 28px; border-radius: 36px; border: none;
    background: transparent; color: var(--btn-ghost-color);
    font-family: inherit; font-size: 0.88rem; cursor: pointer;
    letter-spacing: 0.05em; transition: all 0.3s ease;
    white-space: nowrap;
  }

  .tab-btn:hover { background: var(--tab-hover-bg); color: var(--btn-color); }
  .tab-btn.active { background: var(--tab-active-bg); color: var(--text-cn); font-weight: bold; }

  .container {
    width: 100%; display: flex; flex-direction: column;
    align-items: center; gap: 24px; margin-top: 10px;
  }

  .card {
    background: var(--card-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--card-border); border-radius: 24px;
    padding: 50px 50px 20px; max-width: 620px; width: 90%;
    text-align: center; box-shadow: var(--card-shadow);
    animation: fadeIn 0.5s ease; position: relative;
  }

  .card .fav-btn {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none; font-size: 1.25rem;
    cursor: pointer; opacity: 0.35; transition: all 0.25s;
    color: var(--text-cn); font-family: inherit;
    padding: 4px 8px; border-radius: 20px;
  }

  .card .fav-btn:hover { opacity: 0.8; transform: scale(1.15); }
  .card .fav-btn.faved { opacity: 1; color: var(--fav-active); }

  .card.daily {
    border: 1px solid var(--daily-border);
    box-shadow: var(--card-shadow), var(--daily-glow);
  }

  .card .badge {
    display: inline-block; color: var(--badge-color);
    font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 10px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .divider {
    width: 40px; height: 3px; background: var(--divider-bg);
    margin: 28px auto; border-radius: 2px;
  }

  .quote-cn { color: var(--text-cn); font-size: 1.45rem; line-height: 2; letter-spacing: 0.04em; }
  .quote-en { color: var(--text-en); font-size: 1.05rem; line-height: 1.8; margin-top: 18px; font-style: italic; }
  .author { color: var(--text-author); margin-top: 32px; font-size: 0.9rem; letter-spacing: 0.08em; }
  .author-info { color: var(--text-info); font-size: 0.68rem; margin-top: 8px; line-height: 1.6; letter-spacing: 0.04em; max-width: 400px; margin-left: auto; margin-right: auto; padding-bottom: 16px; }

  .date { color: var(--text-date); margin-top: 14px; font-size: 0.78rem; transition: color 0.5s; }

  .btn-more {
    display: inline-block; background: var(--btn-bg);
    border: 1px solid var(--btn-border); color: var(--btn-color);
    padding: 12px 36px; border-radius: 40px; font-size: 0.9rem;
    cursor: pointer; font-family: inherit; letter-spacing: 0.06em;
    transition: all 0.3s ease; margin-top: 28px;
  }

  .btn-more:hover { background: var(--card-bg); }
  .btn-more:active { transform: scale(0.96); }
  .btn-more:disabled { opacity: 0.3; cursor: not-allowed; }

  .stats { color: var(--text-muted); font-size: 0.75rem; margin-top: 16px; }

  .btn-history, .btn-fav-panel {
    display: inline-block; background: none;
    border: 1px solid var(--btn-ghost-border); color: var(--btn-ghost-color);
    padding: 8px 24px; border-radius: 40px; font-size: 0.78rem;
    cursor: pointer; font-family: inherit; letter-spacing: 0.06em;
    transition: all 0.3s ease; margin-top: 12px;
  }

  .btn-history:hover, .btn-fav-panel:hover {
    background: var(--card-bg); border-color: var(--btn-border); color: var(--btn-color);
  }

  .btn-fav-panel { margin-bottom: 6px; }

  .panel { max-width: 620px; width: 90%; display: none; flex-direction: column; gap: 16px; }
  .panel.open { display: flex; }

  .history-card {
    background: var(--history-card-bg); border: 1px solid var(--history-card-border);
    border-radius: 18px; padding: 28px 32px 18px; text-align: center;
    animation: fadeIn 0.4s ease; position: relative;
  }

  .history-card .fav-btn {
    position: absolute; top: 10px; right: 16px;
    background: none; border: none; font-size: 1.05rem;
    cursor: pointer; opacity: 0.3; transition: all 0.25s;
    color: var(--text-cn); font-family: inherit;
    padding: 2px 6px; border-radius: 20px;
  }

  .history-card .fav-btn:hover { opacity: 0.7; }
  .history-card .fav-btn.faved { opacity: 1; color: var(--fav-active); }

  .history-date { color: var(--text-date); font-size: 0.72rem; margin-bottom: 12px; letter-spacing: 0.08em; }
  .history-card .quote-cn { font-size: 1.15rem; line-height: 1.9; }
  .history-card .quote-en { font-size: 0.9rem; }
  .history-card .author { margin-top: 18px; font-size: 0.78rem; }
  .history-card .author-info { color: var(--text-muted); font-size: 0.62rem; margin-top: 6px; padding-bottom: 0; }

  .panel-empty { color: var(--text-muted); font-size: 0.85rem; text-align: center; padding: 20px; }

  .btn-add {
    display: inline-block; background: none;
    border: 1px solid var(--btn-ghost-border); color: var(--btn-ghost-color);
    padding: 8px 24px; border-radius: 40px; font-size: 0.78rem;
    cursor: pointer; font-family: inherit; letter-spacing: 0.06em;
    transition: all 0.3s ease; margin-top: 8px;
  }

  .btn-add:hover { background: var(--card-bg); border-color: var(--btn-border); color: var(--btn-color); }

  .overlay {
    display: none; position: fixed; inset: 0;
    background: var(--overlay-bg); backdrop-filter: blur(6px);
    align-items: center; justify-content: center; z-index: 100;
  }

  .overlay.open { display: flex; }

  .form-card {
    background: var(--form-bg); border: 1px solid var(--form-border);
    border-radius: 20px; padding: 36px 32px; max-width: 440px;
    width: 90%; animation: fadeIn 0.3s ease;
  }

  .form-card h3 { color: var(--text-cn); font-size: 1rem; font-weight: normal; letter-spacing: 0.06em; margin-bottom: 24px; text-align: center; }
  .form-card label { display: block; color: var(--text-author); font-size: 0.72rem; margin-bottom: 6px; margin-top: 14px; letter-spacing: 0.04em; }
  .form-card label:first-of-type { margin-top: 0; }
  .form-card input, .form-card textarea {
    width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 10px; padding: 10px 14px; color: var(--input-color);
    font-family: inherit; font-size: 0.88rem; outline: none;
    transition: border-color 0.2s; resize: vertical;
  }
  .form-card input:focus, .form-card textarea:focus { border-color: var(--btn-border); }
  .form-card textarea { min-height: 70px; line-height: 1.6; }
  .form-btns { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }
  .form-btns button { padding: 9px 24px; border-radius: 30px; font-family: inherit; font-size: 0.82rem; cursor: pointer; letter-spacing: 0.05em; transition: all 0.2s; }
  .btn-cancel { background: none; border: 1px solid var(--btn-ghost-border); color: var(--btn-ghost-color); }
  .btn-save { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--text-cn); }
  .btn-save:hover { background: var(--card-bg); }

  .tag-custom {
    display: inline-block; background: rgba(100,200,255,0.12); color: rgba(100,200,255,0.6);
    font-size: 0.62rem; padding: 2px 10px; border-radius: 20px;
    letter-spacing: 0.08em; margin-left: 8px; vertical-align: middle;
  }

  .search-bar {
    max-width: 620px; width: 90%; display: flex; gap: 8px; margin-bottom: 4px; margin-top: 4px;
  }

  .search-bar input {
    flex: 1; background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 30px; padding: 10px 20px; color: var(--input-color);
    font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s;
  }

  .search-bar input:focus { border-color: var(--btn-border); }

  .btn-search, .btn-fetch {
    white-space: nowrap; background: var(--btn-bg);
    border: 1px solid var(--btn-border); color: var(--btn-color);
    padding: 10px 18px; border-radius: 30px; font-size: 0.8rem;
    cursor: pointer; font-family: inherit; letter-spacing: 0.04em; transition: all 0.3s ease;
  }

  .btn-search:hover, .btn-fetch:hover { background: var(--card-bg); }

  .spinner {
    display: none; width: 20px; height: 20px;
    border: 2px solid var(--btn-ghost-border); border-top-color: var(--btn-color);
    border-radius: 50%; animation: spin 0.7s linear infinite; margin: 4px auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .api-card {
    background: var(--card-bg); backdrop-filter: blur(20px);
    border: 1px solid var(--api-border); border-radius: 24px;
    padding: 50px 50px 20px; max-width: 620px; width: 90%;
    text-align: center; box-shadow: var(--card-shadow);
    animation: fadeIn 0.5s ease; position: relative;
  }

  .api-card .badge {
    display: inline-block; color: rgba(100,200,255,0.6);
    font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; margin-bottom: 10px;
  }

  .api-card .quote-cn { font-size: 1.2rem; line-height: 1.9; }
  .api-card .quote-en { font-size: 0.95rem; }
  .api-card .author { margin-top: 24px; }

  .search-hint { color: var(--text-muted); font-size: 0.72rem; text-align: center; margin-top: 2px; margin-bottom: 8px; }

  .eco-card { border-left: 3px solid var(--eco-border); }
  .eco-card .badge { color: var(--eco-accent); }
</style>
</head>
<body>

<div class="top-bar">
  <button class="btn-icon" id="btnTheme" onclick="toggleTheme()" title="切换日间/夜间模式">🌙</button>
  <button class="btn-icon" id="btnFavToggle" onclick="toggleFavorites()" title="收藏夹">❤️</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tabQuotes" onclick="switchMode('quotes')">💬 名言</button>
  <button class="tab-btn" id="tabEco" onclick="switchMode('economics')">📈 经济学</button>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="搜索名言关键字，如 love、courage、wisdom..."
         onkeydown="if(event.key==='Enter')searchQuotes()">
  <button class="btn-search" onclick="searchQuotes()">🔍 搜索</button>
  <button class="btn-fetch" onclick="fetchRandomOnline()" title="从网络随机获取">🎲 随机</button>
</div>
<div class="search-hint" id="searchHint"></div>
<div class="spinner" id="spinner"></div>

<div class="container" id="container"></div>

<div class="date" id="dateDisplay"></div>
<button class="btn-more" id="btnMore" onclick="addMoreQuotes()">+ 再来一条</button>
<div class="stats" id="stats"></div>
<button class="btn-history" onclick="toggleHistory()">📅 历史记录</button>
<button class="btn-add" onclick="openAddForm()">✏️ 添加条目</button>
<button class="btn-fav-panel" onclick="toggleFavorites()">❤️ 我的收藏</button>
<div class="panel" id="historyPanel"></div>
<div class="panel" id="favPanel"></div>

<div class="overlay" id="overlay">
  <div class="form-card">
    <h3 id="formTitle">添加名言</h3>
    <label>中文内容</label>
    <textarea id="inputCn" placeholder="输入中文内容..."></textarea>
    <label>英文内容</label>
    <textarea id="inputEn" placeholder="输入英文内容..."></textarea>
    <label id="labelAuthor">作者</label>
    <input id="inputAuthor" placeholder="输入作者名...">
    <label>简介（选填）</label>
    <input id="inputAuthorInfo" placeholder="如：法国作家，1915年诺贝尔文学奖得主...">
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeAddForm()">取消</button>
      <button class="btn-save" onclick="saveCustomQuote()">保存</button>
    </div>
  </div>
</div>

<script>
// ======== 数据 ========
const quotesData = [
  { cn:"生如夏花之绚烂，死如秋叶之静美。", en:"Let life be beautiful like summer flowers and death like autumn leaves.", author:"泰戈尔 (Rabindranath Tagore)", authorInfo:"印度诗人、文学家，1913年诺贝尔文学奖得主" },
  { cn:"世界上最宽阔的是海洋，比海洋更宽阔的是天空，比天空更宽阔的是人的心灵。", en:"There is a spectacle greater than the sea: it is the sky; there is a spectacle greater than the sky: it is the interior of the soul.", author:"雨果 (Victor Hugo)", authorInfo:"法国浪漫主义文学代表，《悲惨世界》《巴黎圣母院》作者" },
  { cn:"黑夜无论怎样悠长，白昼总会到来。", en:"The night is long, but the day will come.", author:"莎士比亚 (William Shakespeare)", authorInfo:"英国文艺复兴时期最伟大的剧作家与诗人" },
  { cn:"人生的价值，并不是用时间，而是用深度去衡量的。", en:"The value of life lies not in the length of days, but in the use we make of them.", author:"蒙田 (Michel de Montaigne)", authorInfo:"法国文艺复兴时期思想家、散文家" },
  { cn:"千里之行，始于足下。", en:"A journey of a thousand miles begins with a single step.", author:"老子 (Lao Tzu)", authorInfo:"中国古代思想家，道家学派创始人，《道德经》作者" },
  { cn:"世上只有一种真正的英雄主义，那就是在认清生活真相之后依然热爱生活。", en:"There is only one heroism in the world: to see the world as it is and to love it.", author:"罗曼·罗兰 (Romain Rolland)", authorInfo:"法国作家，1915年诺贝尔文学奖得主" },
  { cn:"天行健，君子以自强不息。", en:"As Heaven's movement is ever vigorous, so must a gentleman ceaselessly strive along.", author:"《周易》", authorInfo:"中国古代哲学经典，「群经之首，大道之源」" },
  { cn:"不要努力去做一个成功的人，而要努力去做一个有价值的人。", en:"Try not to become a man of success, but rather try to become a man of value.", author:"爱因斯坦 (Albert Einstein)", authorInfo:"德裔美籍物理学家，相对论创立者，1921年诺贝尔奖得主" },
  { cn:"过去属于死神，未来属于你自己。", en:"The past is for death, the future belongs to you.", author:"雪莱 (Percy Bysshe Shelley)", authorInfo:"英国浪漫主义诗人，《西风颂》作者" },
  { cn:"生活就像一盒巧克力，你永远不知道下一颗是什么味道。", en:"Life is like a box of chocolates. You never know what you're gonna get.", author:"《阿甘正传》", authorInfo:"1994年美国经典电影，汤姆·汉克斯主演" },
  { cn:"弱者坐待时机，强者创造时机。", en:"Weak men wait for opportunities; strong men make them.", author:"居里夫人 (Marie Curie)", authorInfo:"波兰裔法国科学家，首位两获诺贝尔奖的伟人" },
  { cn:"一个人可以被毁灭，但不能被打败。", en:"A man can be destroyed but not defeated.", author:"海明威 (Ernest Hemingway)", authorInfo:"美国作家，1954年诺贝尔文学奖得主，《老人与海》作者" },
  { cn:"只有用心灵才能看得清，本质的东西，眼睛是看不见的。", en:"It is only with the heart that one can see rightly; what is essential is invisible to the eye.", author:"圣埃克苏佩里《小王子》", authorInfo:"法国作家、飞行员，《小王子》被译成300多种语言" },
  { cn:"知行合一。", en:"Knowledge is the beginning of practice; doing is the completion of knowing.", author:"王阳明", authorInfo:"明代思想家、军事家，「心学」集大成者" },
  { cn:"如果你因失去了太阳而流泪，那么你也将失去群星了。", en:"If you shed tears when you miss the sun, you also miss the stars.", author:"泰戈尔 (Rabindranath Tagore)", authorInfo:"印度诗人、文学家，1913年诺贝尔文学奖得主" },
  { cn:"不积跬步，无以至千里；不积小流，无以成江海。", en:"Without accumulating small steps, one cannot reach a thousand miles.", author:"荀子", authorInfo:"战国末期思想家，儒家代表人物" },
  { cn:"我思故我在。", en:"I think, therefore I am.", author:"笛卡尔 (René Descartes)", authorInfo:"法国哲学家、数学家，近代哲学之父" },

// ======== 收藏夹（按模式分别存储） ========
function loadFavorites() {
  try { return JSON.parse(localStorage.getItem(getStorageKeys().favorites)) || []; } catch(e) { return []; }
}
function saveFavorites(favs) {
  try { localStorage.setItem(getStorageKeys().favorites, JSON.stringify(favs)); } catch(e) {}
}
function isFaved(q) { return loadFavorites().some(function(f) { return f.cn === q.cn; }); }
function toggleFav(q) {
  var favs = loadFavorites();
  var idx = favs.findIndex(function(f) { return f.cn === q.cn; });
  if (idx >= 0) favs.splice(idx, 1);
  else favs.push({ cn:q.cn, en:q.en, author:q.author, authorInfo:q.authorInfo||'' });
  saveFavorites(favs);
  refreshAllFavButtons();
  if (favPanelOpen) renderFavPanel();
}
function makeFavBtn(q) {
  var btn = document.createElement('button');
  btn.className = 'fav-btn' + (isFaved(q) ? ' faved' : '');
  btn.textContent = isFaved(q) ? '❤️' : '♡';
  btn.onclick = function(e) { e.stopPropagation(); toggleFav(q); };
  return btn;
}
function refreshAllFavButtons() {
  document.querySelectorAll('.fav-btn').forEach(function(btn) {
    var cn = btn.getAttribute('data-cn');
    var favs = loadFavorites();
    var faved = favs.some(function(f) { return f.cn === cn; });
    btn.className = 'fav-btn' + (faved ? ' faved' : '');
    btn.textContent = faved ? '❤️' : '♡';
  });
}

// ======== 核心 ========
function seededRand(seed) {
  var s = seed;
  return function() { s = (s * 1664525 + 1013904223) & 0xFFFFFFFF; return (s >>> 0) / 0xFFFFFFFF; };
}

function getDailyItem() {
  var today = new Date();
  var dateStr = today.toISOString().split('T')[0];
  var seed = dateStr.replace(/-/g, '').split('').reduce(function(a,c) { return a + c.charCodeAt(0); }, 0);
  var rand = seededRand(seed);
  var data = getData();
  return data[Math.floor(rand() * data.length)];
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(getStorageKeys().history)) || {}; } catch(e) { return {}; }
}
function saveHistory(h) {
  try { localStorage.setItem(getStorageKeys().history, JSON.stringify(h)); } catch(e) {}
}

function loadSeen() {
  try { return new Set(JSON.parse(localStorage.getItem(getStorageKeys().seen)) || []); } catch(e) { return new Set(); }
}
function saveSeen(s) {
  try { localStorage.setItem(getStorageKeys().seen, JSON.stringify(Array.from(s))); } catch(e) {}
}

function buildCardHTML(q, badge) {
  return [
    badge ? '<div class="badge">' + badge + '</div>' : '',
    '<div class="quote-cn">' + q.cn + '</div>',
    '<div class="divider"></div>',
    '<div class="quote-en">' + q.en + '</div>',
    '<div class="author">— ' + q.author + '</div>',
    q.authorInfo ? '<div class="author-info">' + q.authorInfo + '</div>' : ''
  ].join('');
}

function buildApiCardHTML(q, badgeText) {
  return [
    '<div class="badge">' + badgeText + '</div>',
    '<div class="quote-cn">' + q.cn + '</div>',
    '<div class="divider"></div>',
    '<div class="quote-en">' + q.en + '</div>',
    '<div class="author">— ' + q.author + '</div>',
    q.authorInfo ? '<div class="author-info">' + q.authorInfo + '</div>' : ''
  ].join('');
}

var dailyItem;
var seen;
var extraCount = 0;
var historyOpen = false;
var favPanelOpen = false;
var searchedCount = 0;

function initDaily() {
  dailyItem = getDailyItem();
  seen = loadSeen();
  seen.add(dailyItem.cn);
  saveSeen(seen);
  extraCount = 0;
  searchedCount = 0;
}

function renderAll() {
  var container = document.getElementById('container');
  container.innerHTML = '';

  // 每日卡片
  var card = document.createElement('div');
  card.className = 'card daily';
  if (currentMode === 'economics') card.classList.add('eco-card');
  card.innerHTML = buildCardHTML(dailyItem, getBadgeLabel());
  var favBtn = makeFavBtn(dailyItem);
  favBtn.setAttribute('data-cn', dailyItem.cn);
  card.appendChild(favBtn);
  container.appendChild(card);

  updateStats();
  updateBtnMore();

  // 保存今日到历史
  var history = loadHistory();
  var todayStr = new Date().toISOString().split('T')[0];
  if (!history[todayStr]) {
    history[todayStr] = { cn:dailyItem.cn, en:dailyItem.en, author:dailyItem.author, authorInfo:dailyItem.authorInfo||'' };
    saveHistory(history);
  }

  // 刷新面板
  if (historyOpen) renderHistory();
  if (favPanelOpen) renderFavPanel();
  refreshAllFavButtons();
}

function updateStats() {
  var total = getData().length + searchedCount;
  document.getElementById('stats').textContent = '共 ' + seen.size + ' / ' + total + ' 条';
}

function updateBtnMore() {
  var btn = document.getElementById('btnMore');
  var available = getData().filter(function(q) { return !seen.has(q.cn); });
  if (!available.length) {
    btn.textContent = '已无更多条目'; btn.disabled = true;
  } else {
    btn.textContent = '+ 再来一条'; btn.disabled = false;
  }
}

function addMoreQuotes() {
  var data = getData();
  var available = data.filter(function(q) { return !seen.has(q.cn); });
  if (!available.length) { updateBtnMore(); return; }

  var picked = available[Math.floor(Math.random() * available.length)];
  seen.add(picked.cn);
  saveSeen(seen);
  extraCount++;

  var container = document.getElementById('container');
  var card = document.createElement('div');
  card.className = 'card extra';
  if (currentMode === 'economics') card.classList.add('eco-card');
  card.innerHTML = buildCardHTML(picked, '#' + (extraCount + searchedCount + 1));
  var favBtn = makeFavBtn(picked);
  favBtn.setAttribute('data-cn', picked.cn);
  card.appendChild(favBtn);
  container.appendChild(card);

  updateStats(); updateBtnMore();
}

// ======== 历史 ========
function toggleHistory() {
  historyOpen = !historyOpen;
  var panel = document.getElementById('historyPanel');
  var btn = document.querySelector('.btn-history');
  if (historyOpen) { renderHistory(); panel.classList.add('open'); btn.textContent = '收起历史'; }
  else { panel.classList.remove('open'); btn.textContent = getHistoryLabel(); }
}

function renderHistory() {
  var history = loadHistory();
  var dates = Object.keys(history).sort().reverse();
  var panel = document.getElementById('historyPanel');
  if (!dates.length) { panel.innerHTML = '<div class="panel-empty">' + getEmptyHistoryMsg() + '</div>'; return; }

  panel.innerHTML = dates.map(function(dateStr) {
    var q = history[dateStr];
    var displayDate = new Date(dateStr.replace(/_.*$/,'') + 'T00:00:00').toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
    var customTag = q.custom ? '<span class="tag-custom">自定义</span>' : '';
    var infoHtml = q.authorInfo ? '<div class="author-info">' + q.authorInfo + '</div>' : '';
    return [
      '<div class="history-card">',
      '<div class="history-date">' + displayDate + customTag + '</div>',
      '<div class="quote-cn">' + q.cn + '</div>',
      '<div class="divider"></div>',
      '<div class="quote-en">' + q.en + '</div>',
      '<div class="author">— ' + q.author + '</div>',
      infoHtml,
      '</div>'
    ].join('');
  }).join('');

  var cards = panel.querySelectorAll('.history-card');
  cards.forEach(function(card) {
    var cnEl = card.querySelector('.quote-cn');
    if (!cnEl) return;
    var cn = cnEl.textContent;
    var hist = loadHistory();
    var keys = Object.keys(hist);
    for (var i = 0; i < keys.length; i++) {
      if (hist[keys[i]].cn === cn) {
        var favBtn = makeFavBtn(hist[keys[i]]);
        favBtn.setAttribute('data-cn', cn);
        card.appendChild(favBtn);
        break;
      }
    }
  });
}

// ======== 收藏面板 ========
function toggleFavorites() {
  favPanelOpen = !favPanelOpen;
  var panel = document.getElementById('favPanel');
  var btn = document.getElementById('btnFavToggle');
  var btnPanel = document.querySelector('.btn-fav-panel');
  if (favPanelOpen) {
    renderFavPanel(); panel.classList.add('open');
    btn.textContent = '❤️'; btn.style.background = 'rgba(255,107,138,0.15)';
    btnPanel.textContent = '收起收藏';
  } else {
    panel.classList.remove('open');
    btn.textContent = '❤️'; btn.style.background = '';
    btnPanel.textContent = getFavLabel();
  }
}

function renderFavPanel() {
  var favs = loadFavorites();
  var panel = document.getElementById('favPanel');
  if (!favs.length) { panel.innerHTML = '<div class="panel-empty">' + getEmptyFavMsg() + '</div>'; return; }

  panel.innerHTML = favs.map(function(q, i) {
    var infoHtml = q.authorInfo ? '<div class="author-info">' + q.authorInfo + '</div>' : '';
    return [
      '<div class="history-card">',
      '<div class="history-date">收藏 #' + (i+1) + '</div>',
      '<div class="quote-cn">' + q.cn + '</div>',
      '<div class="divider"></div>',
      '<div class="quote-en">' + q.en + '</div>',
      '<div class="author">— ' + q.author + '</div>',
      infoHtml,
      '</div>'
    ].join('');
  }).join('');

  var cards = panel.querySelectorAll('.history-card');
  cards.forEach(function(card, i) {
    var favBtn = makeFavBtn(favs[i]);
    favBtn.setAttribute('data-cn', favs[i].cn);
    card.appendChild(favBtn);
  });
}

// ======== 添加表单 ========
function openAddForm() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('formTitle').textContent = getFormTitle();
  document.getElementById('labelAuthor').textContent = getFormLabel();
  document.getElementById('inputCn').focus();
}
function closeAddForm() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('inputCn').value = '';
  document.getElementById('inputEn').value = '';
  document.getElementById('inputAuthor').value = '';
  document.getElementById('inputAuthorInfo').value = '';
}
function saveCustomQuote() {
  var cn = document.getElementById('inputCn').value.trim();
  var en = document.getElementById('inputEn').value.trim();
  var author = document.getElementById('inputAuthor').value.trim() || '佚名';
  var authorInfo = document.getElementById('inputAuthorInfo').value.trim();
  if (!cn) { document.getElementById('inputCn').focus(); return; }

  var history = loadHistory();
  var todayStr = new Date().toISOString().split('T')[0];
  var key = todayStr, suffix = 1;
  while (history[key]) { suffix++; key = todayStr + '_' + suffix; }
  history[key] = { cn:cn, en:en||'', author:author, authorInfo:authorInfo, custom:true };
  saveHistory(history);
  closeAddForm();
  if (historyOpen) renderHistory();
}

// ======== 在线获取 + 搜索 ========
var QUOTABLE_API = 'https://api.quotable.io';
var TRANSLATE_API = 'https://api.mymemory.translated.net/get';

function showSpinner(s) { document.getElementById('spinner').style.display = s ? 'block' : 'none'; }
function setSearchHint(msg) { document.getElementById('searchHint').textContent = msg; }

async function translateToChinese(text) {
  try {
    var resp = await fetch(TRANSLATE_API + '?q=' + encodeURIComponent(text) + '&langpair=en|zh');
    var data = await resp.json();
    if (data.responseStatus === 200 && data.responseData.translatedText) return data.responseData.translatedText;
  } catch(e) {}
  return null;
}

function addApiCard(q) {
  var container = document.getElementById('container');
  var card = document.createElement('div');
  card.className = 'api-card';
  if (currentMode === 'economics') card.classList.add('eco-card');
  card.innerHTML = buildApiCardHTML(q, '🌐 在线获取');
  var favBtn = makeFavBtn(q);
  favBtn.setAttribute('data-cn', q.cn);
  card.appendChild(favBtn);
  container.appendChild(card);
  searchedCount++;
  seen.add(q.cn);
  saveSeen(seen);
  updateStats(); updateBtnMore();
}

async function fetchRandomOnline() {
  showSpinner(true);
  setSearchHint('正在从网络获取...');
  try {
    var query = currentMode === 'economics' ? 'economics' : 'wisdom';
    var resp = await fetch(QUOTABLE_API + '/random?tags=' + query);
    if (!resp.ok) resp = await fetch(QUOTABLE_API + '/random');
    var data = await resp.json();
    var en = data.content, author = data.author || '佚名';
    var cn = await translateToChinese(en);
    addApiCard({ cn:cn||en, en:en, author:author, authorInfo:cn?'':'翻译暂不可用，仅显示原文' });
    setSearchHint(cn ? '已随机获取并翻译' : '已获取（翻译暂不可用）');
  } catch(e) { setSearchHint('网络请求失败，请检查网络后重试'); }
  showSpinner(false);
}

async function searchQuotes() {
  var query = document.getElementById('searchInput').value.trim();
  if (!query) return;
  showSpinner(true);
  setSearchHint('正在搜索「' + query + '」...');
  try {
    var resp = await fetch(QUOTABLE_API + '/search/quotes?query=' + encodeURIComponent(query) + '&limit=5');
    var data = await resp.json();
    if (!data.results || !data.results.length) {
      setSearchHint('没有找到与「' + query + '」相关的结果');
      showSpinner(false); return;
    }
    for (var i = 0; i < data.results.length; i++) {
      var item = data.results[i];
      var cnResult = await translateToChinese(item.content);
      addApiCard({ cn:cnResult||item.content, en:item.content, author:item.author||'佚名', authorInfo:cnResult?'':'翻译暂不可用' });
    }
    setSearchHint('已找到 ' + data.results.length + ' 条与「' + query + '」相关的结果');
  } catch(e) { setSearchHint('搜索请求失败，请检查网络后重试'); }
  showSpinner(false);
}

// ======== 模式切换 ========
function switchMode(mode) {
  if (currentMode === mode) return;
  // 保存当前 seen
  saveSeen(seen);
  // 关闭面板
  if (historyOpen) { historyOpen = false; document.getElementById('historyPanel').classList.remove('open'); document.querySelector('.btn-history').textContent = getHistoryLabel(); }
  if (favPanelOpen) { favPanelOpen = false; document.getElementById('favPanel').classList.remove('open'); document.getElementById('btnFavToggle').style.background = ''; document.querySelector('.btn-fav-panel').textContent = getFavLabel(); }
  // 切换
  currentMode = mode;
  initDaily();
  // 更新UI文字
  document.getElementById('tabQuotes').classList.toggle('active', mode === 'quotes');
  document.getElementById('tabEco').classList.toggle('active', mode === 'economics');
  document.getElementById('searchInput').placeholder = getSearchPlaceholder();
  document.getElementById('formTitle').textContent = getFormTitle();
  document.getElementById('labelAuthor').textContent = getFormLabel();
  document.querySelector('.btn-add').textContent = getAddLabel();
  document.querySelector('.btn-history').textContent = getHistoryLabel();
  document.querySelector('.btn-fav-panel').textContent = getFavLabel();
  document.getElementById('btnFavToggle').textContent = '❤️';
  document.getElementById('btnFavToggle').style.background = '';
  document.getElementById('historyPanel').innerHTML = '';
  document.getElementById('favPanel').innerHTML = '';
  setSearchHint('');
  // 重渲染
  document.getElementById('container').innerHTML = '';
  renderAll();
}

// ======== 初始化 ========
initDaily();
document.getElementById('tabQuotes').classList.add('active');
document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
renderAll();
