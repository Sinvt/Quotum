<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日名言</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-start: #0f0c29;
    --bg-mid: #302b63;
    --bg-end: #24243e;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.1);
    --card-shadow: 0 30px 60px rgba(0,0,0,0.4);
    --daily-border: rgba(255,215,0,0.3);
    --daily-glow: 0 0 40px rgba(255,215,0,0.08);
    --badge-color: rgba(255,215,0,0.7);
    --text-cn: #f0e6d3;
    --text-en: #c4b9a8;
    --text-author: rgba(255,255,255,0.45);
    --text-info: rgba(255,255,255,0.22);
    --text-date: rgba(255,255,255,0.25);
    --text-muted: rgba(255,255,255,0.18);
    --btn-bg: rgba(255,255,255,0.06);
    --btn-border: rgba(255,255,255,0.15);
    --btn-color: rgba(255,255,255,0.65);
    --btn-ghost-border: rgba(255,255,255,0.1);
    --btn-ghost-color: rgba(255,255,255,0.4);
    --divider-bg: rgba(255,255,255,0.3);
    --history-card-bg: rgba(255,255,255,0.03);
    --history-card-border: rgba(255,255,255,0.06);
    --form-bg: #1e1e3a;
    --form-border: rgba(255,255,255,0.12);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.1);
    --input-color: #f0e6d3;
    --overlay-bg: rgba(0,0,0,0.65);
    --fav-active: #ff6b8a;
  }

  body.light {
    --bg-start: #f5f0e8;
    --bg-mid: #e8e0d5;
    --bg-end: #ddd6c8;
    --card-bg: rgba(0,0,0,0.03);
    --card-border: rgba(0,0,0,0.08);
    --card-shadow: 0 20px 50px rgba(0,0,0,0.08);
    --daily-border: rgba(180,140,60,0.5);
    --daily-glow: 0 0 40px rgba(180,140,60,0.12);
    --badge-color: rgba(140,100,30,0.8);
    --text-cn: #3a3028;
    --text-en: #6b5d4f;
    --text-author: rgba(0,0,0,0.4);
    --text-info: rgba(0,0,0,0.3);
    --text-date: rgba(0,0,0,0.28);
    --text-muted: rgba(0,0,0,0.2);
    --btn-bg: rgba(0,0,0,0.04);
    --btn-border: rgba(0,0,0,0.12);
    --btn-color: rgba(0,0,0,0.55);
    --btn-ghost-border: rgba(0,0,0,0.1);
    --btn-ghost-color: rgba(0,0,0,0.38);
    --divider-bg: rgba(0,0,0,0.15);
    --history-card-bg: rgba(0,0,0,0.02);
    --history-card-border: rgba(0,0,0,0.05);
    --form-bg: #faf8f4;
    --form-border: rgba(0,0,0,0.12);
    --input-bg: rgba(0,0,0,0.03);
    --input-border: rgba(0,0,0,0.1);
    --input-color: #3a3028;
    --overlay-bg: rgba(0,0,0,0.4);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
    background-attachment: fixed;
    font-family: 'Georgia', 'Noto Serif SC', 'STSong', serif;
    transition: background 0.8s ease;
    padding: 40px 0;
  }

  .top-bar {
    position: fixed;
    top: 16px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 50;
  }

  .btn-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--btn-ghost-border);
    background: var(--card-bg);
    color: var(--btn-ghost-color);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-family: inherit;
  }

  .btn-icon:hover {
    border-color: var(--btn-border);
    color: var(--btn-color);
  }

  .container {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    margin-top: 10px;
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 50px 50px 20px;
    max-width: 620px;
    width: 90%;
    text-align: center;
    box-shadow: var(--card-shadow);
    animation: fadeIn 0.5s ease;
    position: relative;
  }

  .card .fav-btn {
    position: absolute;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    font-size: 1.25rem;
    cursor: pointer;
    opacity: 0.35;
    transition: all 0.25s;
    color: var(--text-cn);
    font-family: inherit;
    padding: 4px 8px;
    border-radius: 20px;
  }

  .card .fav-btn:hover { opacity: 0.8; transform: scale(1.15); }
  .card .fav-btn.faved { opacity: 1; color: var(--fav-active); }

  .card.daily {
    border: 1px solid var(--daily-border);
    box-shadow: var(--card-shadow), var(--daily-glow);
  }

  .card .badge {
    display: inline-block;
    color: var(--badge-color);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .divider {
    width: 40px;
    height: 3px;
    background: var(--divider-bg);
    margin: 28px auto;
    border-radius: 2px;
  }

  .quote-cn {
    color: var(--text-cn);
    font-size: 1.45rem;
    line-height: 2;
    letter-spacing: 0.04em;
  }

  .quote-en {
    color: var(--text-en);
    font-size: 1.05rem;
    line-height: 1.8;
    margin-top: 18px;
    font-style: italic;
  }

  .author {
    color: var(--text-author);
    margin-top: 32px;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
  }

  .author-info {
    color: var(--text-info);
    font-size: 0.68rem;
    margin-top: 8px;
    line-height: 1.6;
    letter-spacing: 0.04em;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    padding-bottom: 16px;
  }

  .date {
    color: var(--text-date);
    margin-top: 14px;
    font-size: 0.78rem;
    transition: color 0.5s;
  }

  .btn-more {
    display: inline-block;
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--btn-color);
    padding: 12px 36px;
    border-radius: 40px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.06em;
    transition: all 0.3s ease;
    margin-top: 28px;
  }

  .btn-more:hover {
    background: var(--card-bg);
    border-color: var(--btn-ghost-border);
  }

  .btn-more:active { transform: scale(0.96); }

  .stats {
    color: var(--text-muted);
    font-size: 0.75rem;
    margin-top: 16px;
  }

  .btn-history, .btn-fav-panel {
    display: inline-block;
    background: none;
    border: 1px solid var(--btn-ghost-border);
    color: var(--btn-ghost-color);
    padding: 8px 24px;
    border-radius: 40px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.06em;
    transition: all 0.3s ease;
    margin-top: 12px;
  }

  .btn-history:hover, .btn-fav-panel:hover {
    background: var(--card-bg);
    border-color: var(--btn-border);
    color: var(--btn-color);
  }

  .btn-fav-panel { margin-bottom: 6px; }

  .panel {
    max-width: 620px;
    width: 90%;
    display: none;
    flex-direction: column;
    gap: 16px;
  }

  .panel.open { display: flex; }

  .history-card {
    background: var(--history-card-bg);
    border: 1px solid var(--history-card-border);
    border-radius: 18px;
    padding: 28px 32px 18px;
    text-align: center;
    animation: fadeIn 0.4s ease;
    position: relative;
  }

  .history-card .fav-btn {
    position: absolute;
    top: 10px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.05rem;
    cursor: pointer;
    opacity: 0.3;
    transition: all 0.25s;
    color: var(--text-cn);
    font-family: inherit;
    padding: 2px 6px;
    border-radius: 20px;
  }

  .history-card .fav-btn:hover { opacity: 0.7; }
  .history-card .fav-btn.faved { opacity: 1; color: var(--fav-active); }

  .history-date {
    color: var(--text-date);
    font-size: 0.72rem;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
  }

  .history-card .quote-cn { font-size: 1.15rem; line-height: 1.9; }
  .history-card .quote-en { font-size: 0.9rem; }
  .history-card .author { margin-top: 18px; font-size: 0.78rem; }
  .history-card .author-info { color: var(--text-muted); font-size: 0.62rem; margin-top: 6px; padding-bottom: 0; }

  .panel-empty {
    color: var(--text-muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 20px;
  }

  .btn-add {
    display: inline-block;
    background: none;
    border: 1px solid var(--btn-ghost-border);
    color: var(--btn-ghost-color);
    padding: 8px 24px;
    border-radius: 40px;
    font-size: 0.78rem;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.06em;
    transition: all 0.3s ease;
    margin-top: 8px;
  }

  .btn-add:hover {
    background: var(--card-bg);
    border-color: var(--btn-border);
    color: var(--btn-color);
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay-bg);
    backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .overlay.open { display: flex; }

  .form-card {
    background: var(--form-bg);
    border: 1px solid var(--form-border);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 440px;
    width: 90%;
    animation: fadeIn 0.3s ease;
  }

  .form-card h3 {
    color: var(--text-cn);
    font-size: 1rem;
    font-weight: normal;
    letter-spacing: 0.06em;
    margin-bottom: 24px;
    text-align: center;
  }

  .form-card label {
    display: block;
    color: var(--text-author);
    font-size: 0.72rem;
    margin-bottom: 6px;
    margin-top: 14px;
    letter-spacing: 0.04em;
  }

  .form-card label:first-of-type { margin-top: 0; }

  .form-card input, .form-card textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--input-color);
    font-family: inherit;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .form-card input:focus, .form-card textarea:focus { border-color: var(--btn-border); }
  .form-card textarea { min-height: 70px; line-height: 1.6; }

  .form-btns { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }

  .form-btns button {
    padding: 9px 24px; border-radius: 30px; font-family: inherit;
    font-size: 0.82rem; cursor: pointer; letter-spacing: 0.05em; transition: all 0.2s;
  }

  .btn-cancel {
    background: none; border: 1px solid var(--btn-ghost-border); color: var(--btn-ghost-color);
  }

  .btn-save {
    background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--text-cn);
  }

  .btn-save:hover { background: var(--card-bg); }

  .tag-custom {
    display: inline-block;
    background: rgba(100,200,255,0.12);
    color: rgba(100,200,255,0.6);
    font-size: 0.62rem; padding: 2px 10px; border-radius: 20px;
    letter-spacing: 0.08em; margin-left: 8px; vertical-align: middle;
  }

  .tag-faved {
    display: inline-block;
    color: var(--fav-active);
    font-size: 0.9rem;
    margin-left: 4px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<div class="top-bar">
  <button class="btn-icon" id="btnTheme" onclick="toggleTheme()" title="切换日间/夜间模式">🌙</button>
  <button class="btn-icon" id="btnFavToggle" onclick="toggleFavorites()" title="收藏夹">❤️</button>
</div>

<div class="container" id="container">
  <div class="card daily" id="dailyCard"></div>
</div>

<div class="date" id="dateDisplay"></div>
<button class="btn-more" id="btnMore" onclick="addMoreQuotes()">+ 再来一条</button>
<div class="stats" id="stats">共 1 条</div>
<button class="btn-history" onclick="toggleHistory()">📅 历史记录</button>
<button class="btn-add" onclick="openAddForm()">✏️ 添加名言</button>
<button class="btn-fav-panel" onclick="toggleFavorites()">❤️ 我的收藏</button>
<div class="panel" id="historyPanel"></div>
<div class="panel" id="favPanel"></div>

<div class="overlay" id="overlay">
  <div class="form-card">
    <h3>添加名言</h3>
    <label>中文名言</label>
    <textarea id="inputCn" placeholder="输入中文名言..."></textarea>
    <label>英文名言</label>
    <textarea id="inputEn" placeholder="输入英文名言..."></textarea>
    <label>作者</label>
    <input id="inputAuthor" placeholder="输入作者名...">
    <label>作者简介（选填）</label>
    <input id="inputAuthorInfo" placeholder="如：法国作家，1915年诺贝尔文学奖得主...">
    <div class="form-btns">
      <button class="btn-cancel" onclick="closeAddForm()">取消</button>
      <button class="btn-save" onclick="saveCustomQuote()">保存</button>
    </div>
  </div>
</div>

<script>
const quotes = [
  { cn: "生如夏花之绚烂，死如秋叶之静美。", en: "Let life be beautiful like summer flowers and death like autumn leaves.", author: "泰戈尔 (Rabindranath Tagore)", authorInfo: "印度诗人、文学家，1913年诺贝尔文学奖得主，《飞鸟集》《吉檀迦利》作者" },
  { cn: "世界上最宽阔的是海洋，比海洋更宽阔的是天空，比天空更宽阔的是人的心灵。", en: "There is a spectacle greater than the sea: it is the sky; there is a spectacle greater than the sky: it is the interior of the soul.", author: "雨果 (Victor Hugo)", authorInfo: "法国浪漫主义文学代表，《悲惨世界》《巴黎圣母院》作者" },
  { cn: "黑夜无论怎样悠长，白昼总会到来。", en: "The night is long, but the day will come.", author: "莎士比亚 (William Shakespeare)", authorInfo: "英国文艺复兴时期最伟大的剧作家与诗人，代表作《哈姆雷特》《罗密欧与朱丽叶》" },
  { cn: "人生的价值，并不是用时间，而是用深度去衡量的。", en: "The value of life lies not in the length of days, but in the use we make of them.", author: "蒙田 (Michel de Montaigne)", authorInfo: "法国文艺复兴时期思想家、散文家，《随笔集》开创了随笔这一文学体裁" },
  { cn: "千里之行，始于足下。", en: "A journey of a thousand miles begins with a single step.", author: "老子 (Lao Tzu)", authorInfo: "中国古代思想家、哲学家，道家学派创始人，《道德经》作者" },
  { cn: "世上只有一种真正的英雄主义，那就是在认清生活真相之后依然热爱生活。", en: "There is only one heroism in the world: to see the world as it is and to love it.", author: "罗曼·罗兰 (Romain Rolland)", authorInfo: "法国作家、音乐评论家，1915年诺贝尔文学奖得主，《约翰·克利斯朵夫》作者" },
  { cn: "天行健，君子以自强不息。", en: "As Heaven's movement is ever vigorous, so must a gentleman ceaselessly strive along.", author: "《周易》", authorInfo: "中国古代哲学经典，被誉为「群经之首，大道之源」，成书于西周至春秋时期" },
  { cn: "我们最真实的一面，就是我们害怕去尝试的那一面。", en: "Our deepest fear is not that we are inadequate. Our deepest fear is that we are powerful beyond measure.", author: "玛丽安·威廉姆森 (Marianne Williamson)", authorInfo: "美国作家、精神导师，《回归至爱》作者，致力于心灵成长与社会公益" },
  { cn: "不要努力去做一个成功的人，而要努力去做一个有价值的人。", en: "Try not to become a man of success, but rather try to become a man of value.", author: "爱因斯坦 (Albert Einstein)", authorInfo: "德裔美籍物理学家，相对论创立者，1921年诺贝尔物理学奖得主" },
  { cn: "过去属于死神，未来属于你自己。", en: "The past is for death, the future belongs to you.", author: "雪莱 (Percy Bysshe Shelley)", authorInfo: "英国浪漫主义诗人，《西风颂》《解放了的普罗米修斯》作者" },
  { cn: "生活就像一盒巧克力，你永远不知道下一颗是什么味道。", en: "Life is like a box of chocolates. You never know what you're gonna get.", author: "《阿甘正传》", authorInfo: "1994年美国经典电影，由罗伯特·泽米吉斯执导，汤姆·汉克斯主演" },
  { cn: "弱者坐待时机，强者创造时机。", en: "Weak men wait for opportunities; strong men make them.", author: "居里夫人 (Marie Curie)", authorInfo: "波兰裔法国科学家，首位两获诺贝尔奖的伟人，放射性研究的先驱" },
  { cn: "一个人可以被毁灭，但不能被打败。", en: "A man can be destroyed but not defeated.", author: "海明威 (Ernest Hemingway)", authorInfo: "美国作家、记者，1954年诺贝尔文学奖得主，《老人与海》作者" },
  { cn: "只有用心灵才能看得清，本质的东西，眼睛是看不见的。", en: "It is only with the heart that one can see rightly; what is essential is invisible to the eye.", author: "圣埃克苏佩里《小王子》", authorInfo: "法国作家、飞行员，1943年出版的《小王子》被译成300多种语言" },
  { cn: "知行合一。", en: "Knowledge is the beginning of practice; doing is the completion of knowing.", author: "王阳明", authorInfo: "明代思想家、军事家，「心学」集大成者，主张知行合一、致良知" },
  { cn: "如果你因失去了太阳而流泪，那么你也将失去群星了。", en: "If you shed tears when you miss the sun, you also miss the stars.", author: "泰戈尔 (Rabindranath Tagore)", authorInfo: "印度诗人、文学家，1913年诺贝尔文学奖得主，《飞鸟集》《吉檀迦利》作者" },
  { cn: "不积跬步，无以至千里；不积小流，无以成江海。", en: "Without accumulating small steps, one cannot reach a thousand miles; without gathering small streams, one cannot form a river or sea.", author: "荀子", authorInfo: "战国末期思想家、教育家，儒家代表人物，提出「性恶论」与「礼法并重」" },
  { cn: "一个人的命运，决定于晚上8点到10点之间。", en: "The future belongs to those who believe in the beauty of their dreams.", author: "埃莉诺·罗斯福 (Eleanor Roosevelt)", authorInfo: "美国第32任总统富兰克林·罗斯福之妻，人权活动家、外交官" },
  { cn: "我思故我在。", en: "I think, therefore I am.", author: "笛卡尔 (René Descartes)", authorInfo: "法国哲学家、数学家，近代哲学之父，解析几何的奠基人" },
  { cn: "路漫漫其修远兮，吾将上下而求索。", en: "The way ahead is long and winding, yet I will search high and low for what I seek.", author: "屈原", authorInfo: "战国时期楚国诗人、政治家，《离骚》《九歌》作者，楚辞的创立者" },
  { cn: "想象力比知识更重要。", en: "Imagination is more important than knowledge.", author: "爱因斯坦 (Albert Einstein)", authorInfo: "德裔美籍物理学家，相对论创立者，1921年诺贝尔物理学奖得主" },

// ======== 主题切换 ========
const THEME_KEY = 'daily_quotes_theme';
function loadTheme() {
  return localStorage.getItem(THEME_KEY) || 'dark';
}
function saveTheme(t) { localStorage.setItem(THEME_KEY, t); }
function applyTheme(t) {
  if (t === 'light') {
    document.body.classList.add('light');
    document.getElementById('btnTheme').textContent = '☀️';
  } else {
    document.body.classList.remove('light');
    document.getElementById('btnTheme').textContent = '🌙';
  }
}
function toggleTheme() {
  const current = loadTheme();
  const next = current === 'dark' ? 'light' : 'dark';
  saveTheme(next);
  applyTheme(next);
}
applyTheme(loadTheme());

// ======== 收藏夹 ========
const FAV_KEY = 'daily_quotes_favorites';
function loadFavorites() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; }
}
function saveFavorites(favs) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch {}
}
function isFaved(quote) {
  const favs = loadFavorites();
  return favs.some(f => f.cn === quote.cn);
}
function toggleFav(quote) {
  const favs = loadFavorites();
  const idx = favs.findIndex(f => f.cn === quote.cn);
  if (idx >= 0) {
    favs.splice(idx, 1);
  } else {
    favs.push({ cn: quote.cn, en: quote.en, author: quote.author, authorInfo: quote.authorInfo || '' });
  }
  saveFavorites(favs);
  refreshAllFavButtons();
  if (favPanelOpen) renderFavPanel();
}
function quoteKey(q) { return q.cn; }

function makeFavBtn(quote) {
  const btn = document.createElement('button');
  btn.className = 'fav-btn' + (isFaved(quote) ? ' faved' : '');
  btn.textContent = isFaved(quote) ? '❤️' : '♡';
  btn.onclick = function(e) {
    e.stopPropagation();
    toggleFav(quote);
  };
  return btn;
}

function refreshAllFavButtons() {
  document.querySelectorAll('.fav-btn').forEach(btn => {
    const cn = btn.getAttribute('data-cn');
    const favs = loadFavorites();
    const faved = favs.some(f => f.cn === cn);
    btn.className = 'fav-btn' + (faved ? ' faved' : '');
    btn.textContent = faved ? '❤️' : '♡';
  });
}

// ======== 核心 ========
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}

function getDailyQuote() {
  const today = new Date();
  const dateStr = today.toISOString().split('T')[0];
  const seed = dateStr.replace(/-/g, '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const rand = seededRand(seed);
  const paletteIdx = Math.floor(rand() * 7);
  const quoteIdx = Math.floor(rand() * quotes.length);
  return { quote: quotes[quoteIdx], paletteIdx };
}

const STORAGE_KEY = 'daily_quotes_history';
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveHistory(history) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
}

const { quote: dailyQuote } = getDailyQuote();

function buildCardHTML(quote, badge) {
  return `
    ${badge ? `<div class="badge">${badge}</div>` : ''}
    <div class="quote-cn">${quote.cn}</div>
    <div class="divider"></div>
    <div class="quote-en">${quote.en}</div>
    <div class="author">— ${quote.author}</div>
    ${quote.authorInfo ? `<div class="author-info">${quote.authorInfo}</div>` : ''}
  `;
}

// 渲染每日卡片
const dailyCard = document.getElementById('dailyCard');
dailyCard.innerHTML = buildCardHTML(dailyQuote, '今日名言');
const dailyFavBtn = makeFavBtn(dailyQuote);
dailyFavBtn.setAttribute('data-cn', dailyQuote.cn);
dailyCard.appendChild(dailyFavBtn);

document.getElementById('dateDisplay').textContent =
  new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

// 保存今日到历史
(function saveToday() {
  const history = loadHistory();
  const todayStr = new Date().toISOString().split('T')[0];
  if (!history[todayStr]) {
    history[todayStr] = { cn: dailyQuote.cn, en: dailyQuote.en, author: dailyQuote.author, authorInfo: dailyQuote.authorInfo || '' };
    saveHistory(history);
  }
})();

let seen = new Set([dailyQuote.cn]);
let extraCount = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function addMoreQuotes(count = 1) {
  const available = quotes.filter(q => !seen.has(q.cn));
  if (!available.length) {
    document.getElementById('btnMore').textContent = '已无更多名言';
    document.getElementById('btnMore').disabled = true;
    return;
  }

  const toAdd = Math.min(count, available.length);
  const picked = shuffle(available).slice(0, toAdd);
  const container = document.getElementById('container');
  const fragment = document.createDocumentFragment();

  picked.forEach(q => {
    seen.add(q.cn);
    extraCount++;
    const card = document.createElement('div');
    card.className = 'card extra';
    card.innerHTML = buildCardHTML(q, `#${extraCount + 1}`);
    const favBtn = makeFavBtn(q);
    favBtn.setAttribute('data-cn', q.cn);
    card.appendChild(favBtn);
    fragment.appendChild(card);
  });

  container.appendChild(fragment);
  updateStats();

  if (seen.size >= quotes.length) {
    document.getElementById('btnMore').textContent = '已展示全部';
    document.getElementById('btnMore').disabled = true;
  }
}

function updateStats() {
  document.getElementById('stats').textContent = `共 ${seen.size} / ${quotes.length} 条`;
}

// ======== 历史记录 ========
let historyOpen = false;
function toggleHistory() {
  historyOpen = !historyOpen;
  const panel = document.getElementById('historyPanel');
  if (historyOpen) {
    renderHistory();
    panel.classList.add('open');
    document.querySelector('.btn-history').textContent = '收起历史';
  } else {
    panel.classList.remove('open');
    document.querySelector('.btn-history').textContent = '📅 历史记录';
  }
}

function renderHistory() {
  const history = loadHistory();
  const dates = Object.keys(history).sort().reverse();
  const panel = document.getElementById('historyPanel');

  if (!dates.length) {
    panel.innerHTML = '<div class="panel-empty">暂无历史记录，明天再来吧</div>';
    return;
  }

  panel.innerHTML = dates.map(dateStr => {
    const q = history[dateStr];
    const displayDate = new Date(dateStr.replace(/_.*$/,'') + 'T00:00:00').toLocaleDateString('zh-CN', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
    const customTag = q.custom ? '<span class="tag-custom">自定义</span>' : '';
    const infoHtml = q.authorInfo ? `<div class="author-info">${q.authorInfo}</div>` : '';
    const cnEnc = q.cn.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `
      <div class="history-card" data-cn="${cnEnc}">
        <div class="history-date">${displayDate}${customTag}</div>
        <div class="quote-cn">${q.cn}</div>
        <div class="divider"></div>
        <div class="quote-en">${q.en}</div>
        <div class="author">— ${q.author}</div>
        ${infoHtml}
      </div>
    `;
  }).join('');

  // 给历史卡片加收藏按钮
  const cards = panel.querySelectorAll('.history-card');
  cards.forEach(card => {
    const cn = card.getAttribute('data-cn');
    const q = history[Object.keys(history).find(k => history[k].cn === cn) || ''];
    if (q) {
      const favBtn = makeFavBtn(q);
      favBtn.setAttribute('data-cn', cn);
      card.appendChild(favBtn);
    }
  });
}

// ======== 收藏面板 ========
let favPanelOpen = false;
function toggleFavorites() {
  favPanelOpen = !favPanelOpen;
  const panel = document.getElementById('favPanel');
  const btn = document.getElementById('btnFavToggle');
  const btnPanel = document.querySelector('.btn-fav-panel');
  if (favPanelOpen) {
    renderFavPanel();
    panel.classList.add('open');
    btn.textContent = '❤️';
    btn.style.background = 'rgba(255,107,138,0.15)';
    btnPanel.textContent = '收起收藏';
  } else {
    panel.classList.remove('open');
    btn.textContent = '❤️';
    btn.style.background = '';
    btnPanel.textContent = '❤️ 我的收藏';
  }
}

function renderFavPanel() {
  const favs = loadFavorites();
  const panel = document.getElementById('favPanel');

  if (!favs.length) {
    panel.innerHTML = '<div class="panel-empty">还没有收藏的名言，点击卡片上的 ♡ 来收藏吧</div>';
    return;
  }

  panel.innerHTML = favs.map((q, i) => {
    const infoHtml = q.authorInfo ? `<div class="author-info">${q.authorInfo}</div>` : '';
    return `
      <div class="history-card">
        <div class="history-date">收藏 #${i + 1}</div>
        <div class="quote-cn">${q.cn}</div>
        <div class="divider"></div>
        <div class="quote-en">${q.en}</div>
        <div class="author">— ${q.author}</div>
        ${infoHtml}
      </div>
    `;
  }).join('');

  // 给收藏面板卡片也加按钮
  const cards = panel.querySelectorAll('.history-card');
  cards.forEach((card, i) => {
    const favBtn = makeFavBtn(favs[i]);
    favBtn.setAttribute('data-cn', favs[i].cn);
    card.appendChild(favBtn);
  });
}

// ======== 添加名言表单 ========
function openAddForm() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('inputCn').focus();
}

function closeAddForm() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('inputCn').value = '';
  document.getElementById('inputEn').value = '';
  document.getElementById('inputAuthor').value = '';
  document.getElementById('inputAuthorInfo').value = '';
}

function saveCustomQuote() {
  const cn = document.getElementById('inputCn').value.trim();
  const en = document.getElementById('inputEn').value.trim();
  const author = document.getElementById('inputAuthor').value.trim() || '佚名';
  const authorInfo = document.getElementById('inputAuthorInfo').value.trim();

  if (!cn) { document.getElementById('inputCn').focus(); return; }

  const history = loadHistory();
  const todayStr = new Date().toISOString().split('T')[0];

  let key = todayStr;
  let suffix = 1;
  while (history[key]) { suffix++; key = `${todayStr}_${suffix}`; }

  history[key] = { cn, en: en || '', author, authorInfo, custom: true };
  saveHistory(history);
  closeAddForm();
  if (historyOpen) renderHistory();
}
